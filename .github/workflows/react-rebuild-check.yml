name: React rebuild check

on:
  push:
    branches:
      - react-rebuild-dailywave
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Build React app
        run: npm run build

      - name: Upload build preview
        uses: actions/upload-artifact@v4
        with:
          name: life-manager-react-preview
          path: dist
          if-no-files-found: error
